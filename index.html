<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Iriana ⚡ Yerba Mate & Magia</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121620; /* Fondo nocturno mágico estilo Hogwarts */
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #f3f0ea;
            user-select: none;
        }

        .container {
            text-align: center;
            cursor: pointer;
            width: 100%;
            max-width: 420px;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #d4af37; /* Tono dorado mágico */
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .magic-art {
            font-size: 80px;
            margin: 20px 0;
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .letter-box {
            background: #fdfbf7; /* Color pergamino claro */
            color: #2c221e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
            font-family: 'Caveat', cursive;
            font-size: 23px;
            line-height: 1.5;
            animation: fadeIn 0.8s forwards;
            max-height: 75vh;
            overflow-y: auto;
        }

        .letter-box h3 {
            margin-top: 0;
            font-size: 28px;
            color: #74151d; /* Rojo escarlata Hogwarts */
            font-family: 'Caveat', cursive;
        }

        .firma {
            margin-top: 20px;
            text-align: right;
            font-size: 22px;
            color: #552583; /* Toque mágico nocturno */
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .hint {
            font-size: 13px;
            color: #a3a3a3;
            margin-top: 15px;
            letter-style: italic;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div id="stepContent">
            <h2 id="stepTitle">¡Atención, Iriana! Tienes una lechuza en camino... 🦉⚡</h2>
            <div class="magic-art" id="magicEmoji">✉️✨</div>
            <div class="hint">Haz clic en cualquier parte para recibir el mensaje...</div>
        </div>
    </div>

    <script>
        let currentStep = 0;

        const steps = [
            {
                title: "¿Qué poción o misterio será?",
                emoji: "🧪💖",
                hint: "Haz clic para descubrir el aroma de la Amortentia..."
            },
            {
                title: "Dicen que la Amortentia huele a lo que más amas...",
                emoji: "⚡🪄",
                hint: "Un último toque mágico para abrir tu carta..."
            },
            {
                isLetter: true,
                content: `
                    <div class="letter-box">
                        <h3>Mi querida Iriana,</h3>
                        <p>Si me preguntaran a qué huele mi Amortentia, no dudaría ni un segundo: huele exactamente a ti, a tus risas y a todos los momentos mágicos que compartimos. Ni el mejor giratiempo podría hacerme desear cambiar un solo segundo de los días a tu lado.</p>
                        <p>En este Día de la Novia quiero recordarte que eres mi persona favorita en este mundo (incluso más que el Quidditch y todo Hogwarts juntos). Gracias por hacer que mi vida entera se sienta como unhechizo constante de felicidad.</p>
                        <div class="firma">Con todo mi amor y magia, ⚡✨</div>
                    </div>
                `
            }
        ];

        const container = document.getElementById("mainContainer");
        const content = document.getElementById("stepContent");

        container.addEventListener("click", () => {
            currentStep++;
            
            if (currentStep < steps.length) {
                const data = steps[currentStep];
                
                if (data.isLetter) {
                    container.style.cursor = "default";
                    content.innerHTML = data.content;
                } else {
                    content.innerHTML = `
                        <h2>${data.title}</h2>
                        <div class="magic-art">${data.emoji}</div>
                        <div class="hint">${data.hint}</div>
                    `;
                }
            }
        });
    </script>
</body>
</html>
