<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Iriana 💌</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #faf9f6;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #333;
            user-select: none;
        }

        .container {
            text-align: center;
            cursor: pointer;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 26px;
            margin-bottom: 20px;
            color: #2c2c2c;
        }

        .bunny-art {
            font-size: 80px;
            margin: 20px 0;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .letter-box {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            text-align: left;
            font-family: 'Caveat', cursive;
            font-size: 24px;
            line-height: 1.5;
            animation: fadeIn 0.8s forwards;
        }

        .letter-box h3 {
            margin-top: 0;
            font-size: 28px;
            color: #d63384;
            font-family: 'Caveat', cursive;
        }

        .firma {
            margin-top: 20px;
            text-align: right;
            font-size: 22px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .hint {
            font-size: 14px;
            color: #888;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div id="stepContent">
            <h2 id="stepTitle">¡Hola, Iriana! Tienes un correo. 📬</h2>
            <div class="bunny-art" id="bunnyEmoji">🐰💌</div>
            <div class="hint">Haz clic en cualquier parte para continuar...</div>
        </div>
    </div>

    <script>
        let currentStep = 0;

        const steps = [
            {
                title: "¿Qué será?",
                emoji: "✉️📄",
                hint: "Haz clic para abrir el sobre..."
            },
            {
                title: "¡Ábrelo!",
                emoji: "💌✨",
                hint: "Un último toque..."
            },
            {
                isLetter: true,
                content: `
                    <div class="letter-box">
                        <h3>Querida Iriana,</h3>
                        <p>No sé muy bien cómo empezar esta carta, pero sentí que necesitaba escribirte lo mucho que valoro compartir los días contigo. Desde que nos conocemos, has llenado mis días de alegría, risas y momentos únicos. Gracias por ser tal cual eres.</p>
                        <div class="firma">Con todo mi cariño, 💖</div>
                    </div>
                `
            }
        ];

        const container = document.getElementById("mainContainer");
        const content = document.getElementById("stepContent");

        container.addEventListener("click", () => {
            currentStep++;
            
            if (currentStep < steps.length) {
                const data = steps[currentStep];
                
                if (data.isLetter) {
                    container.style.cursor = "default";
                    content.innerHTML = data.content;
                } else {
                    content.innerHTML = `
                        <h2>${data.title}</h2>
                        <div class="bunny-art">${data.emoji}</div>
                        <div class="hint">${data.hint}</div>
                    `;
                }
            }
        });
    </script>
</body>
</html>
