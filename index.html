<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Iriana ⚡ Magia & Amortentia</title>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #121620;
            font-family: 'Quicksand', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            color: #f3f0ea;
            user-select: none;
        }

        .container {
            text-align: center;
            cursor: pointer;
            width: 100%;
            max-width: 440px;
            padding: 20px;
            box-sizing: border-box;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 20px;
            color: #d4af37;
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        .magic-art {
            font-size: 80px;
            margin: 20px 0;
            animation: float 2.5s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-12px); }
        }

        .letter-box {
            background: #fdfbf7;
            color: #2c221e;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: left;
            font-family: 'Caveat', cursive;
            font-size: 21px;
            line-height: 1.4;
            animation: fadeIn 0.8s forwards;
            max-height: 85vh;
            overflow-y: auto;
        }

        .letter-box h3 {
            margin-top: 0;
            font-size: 26px;
            color: #74151d;
            font-family: 'Caveat', cursive;
            margin-bottom: 10px;
        }

        .letter-box p {
            margin: 10px 0;
        }

        .hogwarts-crest {
            text-align: center;
            margin: 12px 0 2px 0;
        }

        .hogwarts-crest img {
            width: 65px;
            height: auto;
        }

        .firma {
            margin-top: 5px;
            text-align: right;
            font-size: 22px;
            color: #552583;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .hint {
            font-size: 13px;
            color: #a3a3a3;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <div id="stepContent">
            <h2 id="stepTitle">¡Atención, amore! Tienes una lechuza en camino... 🦉⚡</h2>
            <div class="magic-art" id="magicEmoji">✉️✨</div>
            <div class="hint">Haz clic en cualquier parte para recibir el mensaje...</div>
        </div>
    </div>

    <script>
        let currentStep = 0;

        const steps = [
            {
                title: "¿Qué poción o misterio será?",
                emoji: "🧪💖",
                hint: "Haz clic para descubrir el aroma de la Amortentia..."
            },
            {
                title: "Dicen que la Amortentia huele a lo que más amas...",
                emoji: "⚡🪄",
                hint: "Un último toque mágico para abrir tu carta..."
            },
            {
                isLetter: true,
                content: `
                    <div class="letter-box">
                        <h3>Mi querida Iriana,</h3>
                        <p>Si me preguntaran a qué huele mi Amortentia, no dudaría ni un solo segundo: huele exactamente a ti, a tus risas y a cada instante que hemos compartido. Eres mi deseo en el espejo de Oesed, así como el recuerdo feliz que uso para invocar mi Patronus.</p>
                        <p>Hoy, en el Día de la Novia (aunque aún no nos hemos llamado asi de forma oficial), quiero recordarte que te has convertido en una de mis personas favoritas. Gracias por alegrarme cada día y por hacer que la vida se sienta un poco más mágica. Eres mi lugar seguro, así como Hogwarts lo fue para Harry.</p>
                        <div class="hogwarts-crest">
                            <img src="https://images.vexels.com/media/users/3/283088/isolated/preview/26e32d207865f12e582a17688481498b-icono-del-escudo-de-hogwarts.png" alt="Escudo Hogwarts">
                        </div>
                        <div class="firma">Te adoro Mimi ♥️</div>
                    </div>
                `
            }
        ];

        const container = document.getElementById("mainContainer");
        const content = document.getElementById("stepContent");

        container.addEventListener("click", () => {
            currentStep++;
            
            if (currentStep < steps.length) {
                const data = steps[currentStep];
                
                if (data.isLetter) {
                    container.style.cursor = "default";
                    content.innerHTML = data.content;
                } else {
                    content.innerHTML = `
                        <h2>${data.title}</h2>
                        <div class="magic-art">${data.emoji}</div>
                        <div class="hint">${data.hint}</div>
                    `;
                }
            }
        });
    </script>
</body>
</html>
